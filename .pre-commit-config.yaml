# Optional: `pip install pre-commit && pre-commit install` runs these before every commit.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: pytest -q -x
        language: system
        pass_filenames: false
        stages: [pre-push]
